# Filled-in example for the fictional DEMO-0001 lot. All values are made up.
goal: speed

lot:
  id: DEMO-0001
  source: B-Stock
  category: home goods
  retailer: Example Warehouse Club
  condition: Used - Good
  manifest_csv: data/manifest.csv
  cost_total: 550
  fees_estimate_pct: 0.15

manifest_columns:
  item_no: Item #
  description: Item Description
  qty: Qty
  unit_retail: Unit Retail
  brand: Brand
  upc: UPC

pricing:
  list_pct_of_retail: 0.50
  offer_floor_pct: 0.40
  markdown_below_offer_floor_after_days: 7
  hard_floor_pct: 0.30
  unmatched_floor_pct_of_list: 0.80
  keep_existing_below_floor: true
  rounding: 0.5
  tier_a_min_retail: 90
  tier_b_min_retail: 40
  tier_c_min_retail: 20

platforms:
  ebay: true
  vinted: true
  depop: true
  facebook: true

accounts:
  ebay:
    seller_username: example-seller
  vinted:
    domain: www.vinted.com
    user_id: 1000000000
    ids:
      catalog_id: 0
      package_size_id: 3
  depop:
    shop: example-shop
  facebook:
    location: Anytown, ST

audit:
  min_photos: 4
  research_max_age_days: 14

logging:
  include_buyer_handles: false
