<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FlipFloor">
  <rect width="64" height="64" rx="14" fill="#0F5132"/>
  <!-- floor line -->
  <rect x="10" y="44" width="44" height="4" rx="2" fill="#D1F2E1"/>
  <!-- price line: falls, bounces off the floor, flips up -->
  <path d="M12 16 L26 38 Q29 42 32 38 L44 20" fill="none" stroke="#F2A900" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow head -->
  <path d="M37 18 L46 17 L46 26" fill="none" stroke="#F2A900" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
